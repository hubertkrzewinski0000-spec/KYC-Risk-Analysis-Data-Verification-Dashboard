name: CI / Deploy

# Runs on every push and pull request to main.
# Two jobs:
#   1. test   — runs the unit test suite (no install needed; uses node:test)
#   2. deploy — publishes to GitHub Pages only after tests pass on main
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # ─────────────────────────────────────────────────────────────────────────
  # JOB 1: Unit tests
  # Uses Node.js built-in test runner (node:test) — zero npm dependencies.
  # ─────────────────────────────────────────────────────────────────────────
  test:
    name: Unit tests (node --test)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Run tests
        run: node --test tests/risk.test.js

  # ─────────────────────────────────────────────────────────────────────────
  # JOB 2: Deploy to GitHub Pages
  # Only runs on pushes to main AND only if the test job passed.
  # The site is a static folder — no build step required.
  # ─────────────────────────────────────────────────────────────────────────
  deploy:
    name: Deploy to GitHub Pages
    needs: test                        # ← waits for tests to pass first
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    permissions:
      contents: read
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # Deploy the entire repo root — index.html, app.js, style.css, data.js, lib/
          path: "."

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
